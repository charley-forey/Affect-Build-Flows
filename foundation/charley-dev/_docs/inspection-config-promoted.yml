endpoints:
- name: projects
  path: /rest/v1.0/projects
  scope: company
  api_version: '1.0'
  bronze_table: cd_bronze_procore_projects
  incremental: filters[updated_at]
- name: vendors
  path: /rest/v1.0/vendors
  scope: company
  api_version: '1.0'
  bronze_table: cd_bronze_procore_vendors
- name: project_vendors
  path: /rest/v1.0/projects/{project_id}/vendors
  scope: project
  api_version: '1.0'
  bronze_table: cd_bronze_procore_project_vendors
- name: company_insurances
  path: /rest/v1.0/companies/{company_id}/insurances
  scope: company
  api_version: '1.0'
  bronze_table: cd_bronze_procore_company_insurances
- name: cost_codes
  path: /rest/v1.0/cost_codes?project_id={project_id}
  scope: project
  api_version: '1.0'
  bronze_table: cd_bronze_procore_cost_codes
- name: standard_cost_codes
  path: /rest/v1.0/standard_cost_codes
  scope: company
  api_version: '1.0'
  bronze_table: cd_bronze_procore_standard_cost_codes
- name: prime_contracts
  path: /rest/v1.0/prime_contracts?project_id={project_id}
  scope: project
  api_version: '1.0'
  bronze_table: cd_bronze_procore_prime_contracts
  incremental: filters[updated_at]
- name: prime_contract_line_items
  path: /rest/v1.0/prime_contracts/{parent_id}/line_items
  scope: parent
  api_version: '1.0'
  bronze_table: cd_bronze_procore_prime_contract_line_items
  incremental: filters[updated_at]
  parent:
    endpoint: prime_contracts
    field: id
- name: payment_applications
  path: /rest/v1.0/prime_contracts/{parent_id}/payment_applications
  scope: parent
  api_version: '1.0'
  bronze_table: cd_bronze_procore_payment_applications
  parent:
    endpoint: prime_contracts
    field: id
- name: requisitions
  path: /rest/v1.1/requisitions?project_id={project_id}
  scope: project
  api_version: '1.1'
  bronze_table: cd_bronze_procore_requisitions
- name: work_order_contracts
  path: /rest/v1.0/work_order_contracts?project_id={project_id}
  scope: project
  api_version: '1.0'
  bronze_table: cd_bronze_procore_work_order_contracts
- name: purchase_order_contracts
  path: /rest/v1.0/purchase_order_contracts?project_id={project_id}
  scope: project
  api_version: '1.0'
  bronze_table: cd_bronze_procore_purchase_order_contracts
- name: work_order_contract_line_items
  path: /rest/v1.0/work_order_contracts/{parent_id}/line_items
  scope: parent
  api_version: '1.0'
  bronze_table: cd_bronze_procore_work_order_contract_line_items
  parent:
    endpoint: work_order_contracts
    field: id
- name: purchase_order_contract_line_items
  path: /rest/v1.0/purchase_order_contracts/{parent_id}/line_items
  scope: parent
  api_version: '1.0'
  bronze_table: cd_bronze_procore_purchase_order_contract_line_items
  parent:
    endpoint: purchase_order_contracts
    field: id
- name: commitments
  path: /rest/v1.0/commitments?project_id={project_id}
  scope: project
  api_version: '1.0'
  bronze_table: cd_bronze_procore_commitments
- name: commitment_contracts
  path: /rest/v2.0/companies/{company_id}/projects/{project_id}/commitment_contracts
  scope: project
  api_version: '2.0'
  bronze_table: cd_bronze_procore_commitment_contracts
- name: budget
  path: /rest/v1.0/projects/{project_id}/budget
  scope: project
  api_version: '1.0'
  bronze_table: cd_bronze_procore_budget
- name: budget_views
  path: /rest/v1.0/budget_views?project_id={project_id}
  scope: project
  api_version: '1.0'
  bronze_table: cd_bronze_procore_budget_views
- name: budget_detail_rows
  path: /rest/v1.0/budget_views/{parent_id}/detail_rows
  scope: parent
  api_version: '1.0'
  bronze_table: cd_bronze_procore_budget_detail_rows
  parent:
    endpoint: budget_views
    field: id
    where_field: name
    where_value: STANDARD BUDGET VIEW - CM
- name: prime_change_orders
  path: /rest/v1.0/change_order_packages?project_id={project_id}
  scope: project
  api_version: '1.0'
  bronze_table: cd_bronze_procore_prime_change_orders
- name: direct_costs
  path: /rest/v1.1/projects/{project_id}/direct_costs
  scope: project
  api_version: '1.1'
  bronze_table: cd_bronze_procore_direct_costs
- name: direct_cost_line_items
  path: /rest/v1.0/projects/{project_id}/direct_costs/line_items
  scope: project
  api_version: '1.0'
  bronze_table: cd_bronze_procore_direct_cost_line_items
  incremental: filters[updated_at]
- name: potential_change_orders
  path: /rest/v1.0/potential_change_orders?project_id={project_id}
  scope: project
  api_version: '1.0'
  bronze_table: cd_bronze_procore_potential_change_orders
  incremental: filters[updated_at]
- name: change_order_requests
  path: /rest/v1.0/change_order_requests?project_id={project_id}
  scope: project
  api_version: '1.0'
  bronze_table: cd_bronze_procore_change_order_requests
  incremental: filters[updated_at]
- name: change_order_statuses
  path: /rest/v1.0/change_order/statuses
  scope: company
  api_version: '1.0'
  bronze_table: cd_bronze_procore_change_order_statuses
- name: rfis
  path: /rest/v1.0/projects/{project_id}/rfis
  scope: project
  api_version: '1.0'
  bronze_table: cd_bronze_procore_rfis
- name: rfi_statuses
  path: /rest/v1.0/projects/{project_id}/rfis/filter_options/status
  scope: project
  api_version: '1.0'
  bronze_table: cd_bronze_procore_rfi_statuses
  key: value
- name: rfi_priorities
  path: /rest/v1.0/projects/{project_id}/rfis/filter_options/priority
  scope: project
  api_version: '1.0'
  bronze_table: cd_bronze_procore_rfi_priorities
  key: value
- name: submittals
  path: /rest/v1.1/projects/{project_id}/submittals
  scope: project
  api_version: '1.1'
  bronze_table: cd_bronze_procore_submittals
- name: observations
  path: /rest/v1.0/observations/items?project_id={project_id}
  scope: project
  api_version: '1.0'
  bronze_table: cd_bronze_procore_observations
- name: observation_types
  path: /rest/v1.0/observations/types
  scope: company
  api_version: '1.0'
  bronze_table: cd_bronze_procore_observation_types
- name: punch_items
  path: /rest/v1.0/punch_items?project_id={project_id}
  scope: project
  api_version: '1.0'
  bronze_table: cd_bronze_procore_punch_items
- name: punch_item_types
  path: /rest/v1.0/punch_item_types
  scope: company
  api_version: '1.0'
  bronze_table: cd_bronze_procore_punch_item_types
- name: inspection_logs
  path: /rest/v1.0/projects/{project_id}/inspection_logs
  scope: project
  api_version: '1.0'
  bronze_table: cd_bronze_procore_inspection_logs
- name: checklist_lists
  path: /rest/v1.0/checklist/lists?project_id={project_id}
  scope: project
  api_version: '1.0'
  bronze_table: cd_bronze_procore_checklist_lists
- name: checklist_list_items
  path: /rest/v1.0/projects/{project_id}/checklist/list_items?filters[list_id][]={parent_id}
  scope: parent
  api_version: '1.0'
  parent:
    endpoint: checklist_lists
    field: id
  bronze_table: cd_bronze_procore_checklist_list_items
- name: incidents
  path: /rest/v1.0/projects/{project_id}/incidents
  scope: project
  api_version: '1.0'
  bronze_table: cd_bronze_procore_incidents
  incremental: filters[updated_at]
- name: incident_injuries
  path: /rest/v1.0/projects/{project_id}/incidents/injuries
  scope: project
  api_version: '1.0'
  bronze_table: cd_bronze_procore_incident_injuries
- name: incident_near_misses
  path: /rest/v1.0/projects/{project_id}/incidents/near_misses
  scope: project
  api_version: '1.0'
  bronze_table: cd_bronze_procore_incident_near_misses
- name: incident_severity_levels
  path: /rest/v1.0/companies/{company_id}/incidents/severity_levels
  scope: company
  api_version: '1.0'
  bronze_table: cd_bronze_procore_incident_severity_levels
  incremental: filters[updated_at]
- name: manpower_daily_totals
  date_range_days: 365
  path: /rest/v1.0/projects/{project_id}/manpower_logs/daily_totals
  scope: project
  api_version: '1.0'
  bronze_table: cd_bronze_procore_manpower_daily_totals
  key: date
- name: manpower_logs
  date_range_days: 365
  path: /rest/v1.0/projects/{project_id}/manpower_logs
  scope: project
  api_version: '1.0'
  bronze_table: cd_bronze_procore_manpower_logs
- name: daily_log_headers
  date_range_days: 30
  date_param_prefix: filters
  path: /rest/v1.0/projects/{project_id}/daily_logs
  scope: project
  api_version: '1.0'
  bronze_table: cd_bronze_procore_daily_log_headers
- name: schedule
  path: /rest/v1.0/projects/{project_id}/schedule
  scope: project
  api_version: '1.0'
  bronze_table: cd_bronze_procore_schedule
